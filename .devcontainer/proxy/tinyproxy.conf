## Egress allowlist proxy for the Iris sandbox.
User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Info
MaxClients 100

## The proxy is only reachable from the isolated docker networks it is attached
## to (its port is never published to the host), so allowing all client IPs is
## safe here.
Allow 0.0.0.0/0
ViaProxyName "iris"

## Deny everything except hosts matching the allowlist (POSIX extended regex,
## matched against the request host — including HTTPS CONNECT targets).
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/allowlist"
FilterExtended On
FilterCaseSensitive Off

## Only permit CONNECT (HTTPS) to standard TLS ports. This refuses CONNECT to
## SMTP (25/465/587) and any other non-web port.
ConnectPort 443
ConnectPort 563
