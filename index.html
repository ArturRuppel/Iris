<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is half a pair with black-translucent below: the
         status bar style puts the page under the notch, and body's
         env(safe-area-inset-*) padding puts it back. One without the other
         hides the header in standalone mode only — exactly where you are not
         testing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/iris-favicon.svg?v=harmonia-20261003" />
    <meta name="theme-color" content="#1f3f7a" />

    <!-- Home-screen install (docs/serving.md). iOS reads apple-touch-icon and
         NOT the manifest's icons; without it Safari screenshots the page and
         uses that as the icon. The manifest's PNGs are there for Chrome. -->
    <link rel="manifest" href="/manifest.webmanifest?v=harmonia-20261003" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=harmonia-20261003" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Iris" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Iris</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
