[package]
name = "iris"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Cargo.lock pins time=0.3.41 / serde_with=3.12 / plist=1.7.4: the cookie
# crate (tauri transitive dep) fails to compile against time>=0.3.48 (E0119).
# If `cargo update` re-breaks the build, re-apply those downgrades.
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
